name: OSPI data collection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/pull_ospi_riverview.py"
      - "scripts/analyze_ospi_goal1.py"
      - "scripts/test_ospi_goal1_analysis.py"
      - "scripts/build_goal1_core_indicators.py"
      - "scripts/build_goal1_subgroup_gaps.py"
      - "scripts/write_ospi_actions_summary.py"
      - "requirements-ospi.txt"
      - ".github/workflows/ospi-collect.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ospi.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-ospi.txt
      - name: Collect OSPI data
        id: collect
        continue-on-error: true
        run: python scripts/pull_ospi_riverview.py
      - name: Analyze Goal 1 outcomes
        if: steps.collect.outcome == 'success'
        run: |
          python scripts/analyze_ospi_goal1.py
          python scripts/test_ospi_goal1_analysis.py
      - name: Build Goal 1 core indicators
        if: steps.collect.outcome == 'success'
        run: python scripts/build_goal1_core_indicators.py
      - name: Build Goal 1 subgroup gaps
        if: steps.collect.outcome == 'success'
        run: python scripts/build_goal1_subgroup_gaps.py
      - name: Write Actions summary
        if: always()
        run: python scripts/write_ospi_actions_summary.py
      - name: Upload reproducibility package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ospi-riverview-${{ github.run_id }}
          path: |
            ospi_riverview/
            ospi_riverview.zip
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce complete collection
        if: steps.collect.outcome != 'success'
        run: |
          echo "OSPI collection incomplete; inspect collection_report.csv in the artifact."
          exit 1
