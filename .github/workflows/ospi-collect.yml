name: OSPI data collection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/pull_ospi_riverview.py"
      - "requirements-ospi.txt"
      - ".github/workflows/ospi-collect.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ospi.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-ospi.txt
      - name: Collect OSPI data
        id: collect
        continue-on-error: true
        run: python scripts/pull_ospi_riverview.py
      - name: Write Actions summary
        if: always()
        run: |
          echo "## OSPI collection" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f ospi_riverview/collection_report.csv ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
import pandas as pd
df=pd.read_csv("ospi_riverview/collection_report.csv").fillna("")
print(f"Validated: **{(df.status == 'OK').sum()}/{len(df)}** required dataset-periods")
print()
print("| Family | Period | Dataset | Status | Scoped rows | Riverview rows |")
print("|---|---|---|---|---:|---:|")
for _,r in df.iterrows():
    print(f"| {r.family} | {r.period} | {r.dataset_id} | {r.status} | {r.scoped_rows} | {r.riverview_rows} |")
PY
          else
            echo "No collection report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reproducibility package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ospi-riverview-${{ github.run_id }}
          path: |
            ospi_riverview/
            ospi_riverview.zip
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce complete collection
        if: steps.collect.outcome != 'success'
        run: |
          echo "OSPI collection incomplete; inspect collection_report.csv in the artifact."
          exit 1
